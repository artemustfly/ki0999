<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EFE7D6; --bg2:#FAF6EC; --ink:#1B2E24; --ink2:#5E6E62; --line:#D8CDB3; --line2:#E7DEC8;
  --gold:#96762A; --gold2:#C9A85A; --rust:#9C441E; --shade:rgba(27,46,36,.10); --shade2:rgba(27,46,36,.05);
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif; --sans:"Karla","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#111914; --bg2:#1A2620; --ink:#EEE6D2; --ink2:#A39B86; --line:#33413A; --line2:#26312B;
  --gold:#C9A85A; --gold2:#DCC188; --rust:#D0703E; --shade:rgba(0,0,0,.45); --shade2:rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#111914; --bg2:#1A2620; --ink:#EEE6D2; --ink2:#A39B86; --line:#33413A; --line2:#26312B;
  --gold:#C9A85A; --gold2:#DCC188; --rust:#D0703E; --shade:rgba(0,0,0,.45); --shade2:rgba(0,0,0,.25);}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.eyebrow,.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* ---------- scène ---------- */
#scene{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(120px,37vh) minmax(0,1fr) auto;cursor:pointer}
@media (min-width:900px) and (orientation:landscape){
  #scene{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,42%) minmax(0,58%);
         grid-template-areas:"bar bar" "cam txt" "foot foot"}
  #bar{grid-area:bar} #cam{grid-area:cam;margin:0 0 0 16px} #txt{grid-area:txt;align-content:center;padding-inline:36px} #foot{grid-area:foot}
}

/* barre */
#bar{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:grid;gap:8px;background:var(--bg);z-index:5}
#bar .row{display:flex;align-items:center;gap:10px}
#acte{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2);white-space:nowrap;flex:1}
#acte b{color:var(--gold)}
#pct{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
#prog{height:3px;background:var(--line2);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
#jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
#jump::-webkit-scrollbar{display:none}
.jb{flex:none}
.jb.next{margin-left:auto;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jb.vt{font-size:11.5px;padding:0 10px}
#jump[hidden]{display:none}
.jb{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.jb.on{border-color:var(--gold);color:var(--ink)}
.jb i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px}

/* caméra */
#cam{position:relative;overflow:hidden;min-height:150px;margin:0 16px;border-radius:18px;background:#C3D8BC;box-shadow:0 12px 30px -18px var(--shade),inset 0 0 0 1px rgba(0,0,0,.05)}
#cam svg{position:absolute;inset:0;width:100%;height:100%}
#cam::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background:radial-gradient(ellipse at 50% 55%,transparent 66%,rgba(30,50,40,.22) 100%)}

/* texte */
#txt{padding:18px 20px 8px;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;overflow-y:auto;min-height:0;scrollbar-width:none}
#txt::-webkit-scrollbar{display:none}
#txt>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#txt h2{font-size:clamp(27px,6.6vw,42px);letter-spacing:-.01em}
#txt h2.it{font-style:italic}
.ln{font-size:clamp(15px,3.9vw,18px);color:var(--ink2);max-width:52ch}
.ln strong{color:var(--ink);font-weight:600}
.ln.big{font-family:var(--serif);font-size:clamp(21px,5.4vw,28px);color:var(--ink);font-style:italic;line-height:1.22}
.ln.flow{font-family:var(--sans);font-size:clamp(13px,3.4vw,15px);font-weight:600;letter-spacing:.02em;color:var(--ink);
  border:1px solid var(--line);padding:10px 14px;background:var(--bg2);border-radius:12px}
.ln.quote{border-left:3px solid var(--gold);padding-left:14px;font-family:var(--serif);font-style:italic;font-size:clamp(18px,4.6vw,22px);color:var(--ink)}
ul.ln{margin:0;padding-left:20px;display:grid;gap:5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px}
.fact{font-size:12.5px;font-weight:600;letter-spacing:.03em;border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--ink2);background:var(--bg2);min-height:34px;display:inline-flex;align-items:center}
.fact.gold{border-color:var(--gold2);color:var(--gold)}
.fact.rust{border-color:var(--rust);color:var(--rust)}
button.fact{cursor:pointer}
button.fact:hover{border-color:var(--ink)}

/* prix */
.price{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px}
.price .main{font-family:var(--serif);font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:-.015em}
.price .main small{font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-left:8px;vertical-align:.5em}
.price .sub{font-size:11px;color:var(--ink2);margin-top:7px;letter-spacing:.02em}
.price .sub b{font-weight:700}

/* pied */
#foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--bg);z-index:5}
#hint{font-size:12.5px;color:var(--ink2);flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 11px var(--sans);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg2);color:var(--ink)}
#hint .pulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bl 1.6s ease-in-out infinite;flex:none}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.navb{height:44px;min-width:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;color:var(--ink2);background:var(--bg2)}
.navb[disabled]{opacity:.3;cursor:default}
.navb.go{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:0 26px;font-weight:700;font-size:14px;letter-spacing:.04em;text-align:center;box-shadow:0 8px 20px -10px var(--shade)}
.navb.go:active{transform:translateY(1px)}

/* choix */
#choix{display:grid;gap:10px}
.ch{border:1px solid var(--line);background:var(--bg2);border-radius:16px;padding:16px 18px;text-align:left;display:grid;gap:6px;transition:border-color .2s,transform .2s,box-shadow .2s;cursor:default}
.ch[data-opt]{cursor:pointer}
.ch[data-opt]:hover,.ch[data-opt]:focus-visible{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 12px 24px -16px var(--shade)}
.ch .t{font-family:var(--serif);font-size:22px;line-height:1.1}
.ch .p{font-size:14px;color:var(--ink2)}
.ch .a{font-size:13.5px;color:var(--ink);border-top:1px solid var(--line2);padding-top:8px;margin-top:2px;animation:rise .5s both}
.ch .m{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-top:6px;animation:rise .5s both}
.ch .m b{font-family:var(--serif);font-size:24px;letter-spacing:-.01em}
.ch .m span{color:var(--ink2);font-size:11px}
.ch .go{margin-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);animation:rise .5s both}
.ch2{border-color:var(--gold2)}
@media (min-width:900px){#choix{grid-template-columns:1fr 1fr}}

/* frise compacte */
.mini-frise{display:grid;gap:5px;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px}
.mf{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:end;font-size:12.5px;width:100%;text-align:left;padding:4px 0;border-radius:8px}
.mf:hover{background:var(--shade2)}
.mfn{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfd{display:grid;gap:4px;font-size:13px;color:var(--ink2);padding:6px 10px 10px 72px;animation:rise .35s both}
.mfd b{color:var(--ink);font-weight:600}
.mfm{font-size:11.5px;letter-spacing:.03em;color:var(--gold);font-weight:700}
.mfh{font-size:11px;color:var(--ink2);margin-top:4px}
.mf i{font-style:normal;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;font-size:10px;font-weight:700;padding-bottom:2px}
.mf .b{height:14px;background:var(--gold);border-radius:4px}
.mf.ind .b{background:repeating-linear-gradient(90deg,var(--gold2) 0 5px,transparent 5px 9px);border:1px solid var(--gold2)}
.mf .j{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mf.lev{grid-template-columns:64px 1fr;cursor:default}
.mf.lev .b{background:var(--rust);height:2px}
.mf.lev strong{color:var(--rust);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.vl{border-top:1px solid var(--line2);padding:8px 0;display:grid;gap:2px}
.vl:first-child{border-top:0;padding-top:0}

/* personnage */
#cam g[data-part]{transition:opacity .55s cubic-bezier(.3,.7,.2,1)}
#cam.focusing g[data-part]{opacity:.42}
#cam g[data-part].on{opacity:1}
#cam g[data-part="tete"],#cam g[data-part="peau"],#cam g[data-part="nerfs"]{opacity:1!important}
#cam.focusing .bg{opacity:.5;transition:opacity .55s}
#cam .ov{opacity:0;visibility:hidden;transition:opacity .6s .15s,visibility 0s .75s}
#cam g[data-part].on .ov{opacity:1;visibility:visible;transition:opacity .6s .15s,visibility 0s}
#cam g[data-part].on.anim{transform-box:fill-box;transform-origin:center;animation:var(--idle)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes flux{to{stroke-dashoffset:-140}}
#cam g[data-part="nerfs"].on .fl{animation:flux 1.6s linear infinite}
@keyframes auraflick{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.03);opacity:.8}}
#cam g[data-part="peau"].on .aura{transform-box:fill-box;transform-origin:50% 60%;animation:auraflick .34s ease-in-out infinite}
.lids{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.3s infinite}
@keyframes blink{0%,93.5%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
#cam .noir{opacity:0}
#cam.ki .noir{animation:noir 1.9s ease both}
@keyframes noir{0%{opacity:0}10%{opacity:.94}60%{opacity:.94}100%{opacity:0}}
#cam.ki .figure{animation:vanish 1.9s ease both}
@keyframes vanish{0%{opacity:1}16%{opacity:.1}30%{opacity:.7}44%{opacity:.06}62%{opacity:.55}100%{opacity:1}}
#cam g[data-part="peau"] .ov{transition:opacity 1.4s ease .1s,visibility 0s 1.5s}
#cam g[data-part="peau"].on .ov{transition:opacity 1.4s ease .1s,visibility 0s}

/* intro vidéo */
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:opacity .9s ease;cursor:default}
#intro.out{opacity:0;pointer-events:none}
#vid{width:min(76vmin,560px);height:min(76vmin,560px);object-fit:contain;transition:opacity 1.2s ease;background:#000}
#vid.fade{opacity:.12}
#logo{position:absolute;inset:0;margin:auto;width:150px;height:170px;display:grid;place-items:center;border-radius:50%;animation:logoIn 1.4s ease both}
#logo img{width:96px;filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,235,235,.9)) drop-shadow(0 0 22px rgba(132,18,40,.95)) drop-shadow(0 0 48px rgba(110,12,34,.7));animation:halo 2.8s ease-in-out infinite}
@keyframes halo{0%,100%{filter:brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,235,235,.8)) drop-shadow(0 0 18px rgba(132,18,40,.9)) drop-shadow(0 0 40px rgba(110,12,34,.55))}
  50%{filter:brightness(0) invert(1) drop-shadow(0 0 14px rgba(255,240,240,1)) drop-shadow(0 0 30px rgba(150,22,48,1)) drop-shadow(0 0 64px rgba(120,14,38,.8))}}
@keyframes logoIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
#logo span{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,225,225,.6);font-weight:700}
/* mode léger : mobile / tactile — pas de filtres animés, pas de turbulence */
html.lite .aura .a2{display:none}
html.lite .aura .a1{filter:url(#fAuraLite)}
html.lite .aura .a0{filter:none;opacity:.7}
@keyframes auraflickLite{0%,100%{opacity:.95}50%{opacity:.7}}
html.lite #cam g[data-part="peau"].on .aura{animation:auraflickLite 1.1s ease-in-out infinite;transform:none}
html.lite .nglow{filter:none;opacity:.3;stroke-width:4}
html.lite .npts{filter:none}
html.lite #cam g[data-part].on.anim{animation-duration:7s}
html.lite #logo img{animation:none;filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,235,235,.9)) drop-shadow(0 0 24px rgba(132,18,40,.9))}
html.lite #logo{isolation:isolate}
html.lite #logo::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(150,22,48,.55),rgba(110,12,34,.25) 45%,transparent 70%);animation:haloLite 2.8s ease-in-out infinite;z-index:-1}
@keyframes haloLite{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<!-- ============ PERSONNAGE — estampe ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  </linearGradient>
  <!-- flux : rouge → violet, animé -->

  <filter id="fAura2" x="-40%" y="-25%" width="180%" height="150%">

    </feTurbulence>

    <feGaussianBlur in="j" stdDeviation="5" result="b"/>

    <feComposite in2="b" operator="in"/>
  </filter>

      <path d="M-5 5a1.8 1.8 0 0 1 3.6 0M5 5a1.8 1.8 0 0 1 3.6 0" transform="translate(3.2)"/>
    </g>
  </pattern>

    <path d="M2 6q0-4 3-4t2 3q-1 3-3 3-2-1-2-2z" fill="none" stroke="#E0B44A" stroke-width=".5" opacity=".9"/>
    <circle cx="7" cy="2" r=".7" fill="#E0B44A" opacity=".8"/>
  </pattern>
  <pattern id="pKnit" width="3" height="3" patternUnits="userSpaceOnUse">
    <path d="M0 1.5q.75-1.2 1.5 0t1.5 0" fill="none" stroke="#000" stroke-width=".45" opacity=".18"/>
  </pattern>
  <clipPath id="clTorse"><path d="M84 124h32v126H84z"/></clipPath>
  <clipPath id="clJackL"><path d="M58 146q2-26 24-32l10 4-4 132H60z"/></clipPath>
  <clipPath id="clJackR"><path d="M142 146q-2-26-24-32l-10 4 4 132h28z"/></clipPath>

<g id="monsieur-src">
  <!-- ═══ décor ═══ -->
  <g class="bg">
    <rect x="-140" y="-120" width="480" height="700" fill="url(#gSky)"/>
    <g fill="none" stroke="#5E8468" stroke-width="1" opacity=".45">

let vb={x:0,y:0,w:200,h:440}, raf=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fit(c){
  const r=cam.clientWidth/Math.max(cam.clientHeight,1), pad=1.1;
  let w=c.w*pad, h=c.h*pad;
  if(w/h < r) w=h*r; else h=w/r;
  const max=c.w*1.6; let ay=.5;
  if(!c.libre && w>max){ w=max; h=w/r; ay=(c.ancre!==undefined?c.ancre:.38); }
  return {x:c.x+c.w/2-w/2, y:c.y+c.h*ay-h*ay, w, h};
}
function goto(cadre,instant){
  const to=fit(CADRE[cadre]||CADRE.entier), from={...vb};
  const d=Math.hypot(to.x-from.x,to.y-from.y)+Math.abs(to.w-from.w);
  const dur=instant?0:Math.min(1150,420+d*1.15);
  const t0=performance.now(); cancelAnimationFrame(raf);
  (function step(now){
    const k=dur?Math.min(1,(now-t0)/dur):1, e=ease(k);
    vb={x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, w:from.w+(to.w-from.w)*e, h:from.h+(to.h-from.h)*e};
    svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if(k<1) raf=requestAnimationFrame(step);
  })(t0);
  return dur;
}
function focus(part){
  cam.classList.toggle("focusing",!!part);
  cam.classList.remove("ki");
  if(part==="peau"){ void cam.offsetWidth; cam.classList.add("ki"); }
  svg.querySelectorAll("g[data-part]").forEach(g=>{
    const on=g.dataset.part===part;
    g.classList.toggle("on",on); g.classList.toggle("anim",on&&!!IDLE[part]);
    g.style.setProperty("--idle", on?(IDLE[part]||"none"):"none");
  });
}

    const w=Math.round(t.j.max/maxJ*100);
    out+=`<button class="mf${t.chiffrage==="indicatif"?" ind":""}" data-mf="${t.id}"><i>${mois}</i>
      <span style="display:grid;gap:3px;min-width:0"><span class="mfn">${t.n} · ${t.nom}</span><span class="b" style="display:block;width:${w}%;min-width:14px"></span></span>
      <span class="j">${fj(t.j.min)} à ${fj(t.j.max)} j</span></button>
      <div class="mfd" data-mfd="${t.id}" hidden><b>Tiroir ${t.n} · ${t.nom} — ${t.titre}</b><span>${t.interet}</span><span class="mfm">${periodeLongue(t)} · ${fj(t.j.min)} à ${fj(t.j.max)} jours${t.chiffrage==="indicatif"?" · chiffrage indicatif":""}</span></div>`;
  });
  return `<div class="mini-frise">${out}<p class="mfh">Appuyez sur une étape pour voir ce qu'elle couvre.</p></div>`;
}
function choixHTML(niv){
  return `<div id="choix">${["option1","option2"].map((k,i)=>{
    const o=OPTIONS[k], tot=totalOpt(o);
    return `<div class="ch ch${i+1}" ${niv>=3?`data-opt="${k}" role="button" tabindex="0"`:""}>
      <span class="eyebrow">${i?"La trajectoire complète":"Le premier segment"}</span>
      <span class="t">${o.nom} — ${o.sous}</span>
      <span class="p">${o.promesse}</span>
      ${niv>=2?`<span class="a">${o.argument}</span>`:""}
      ${niv>=3?`<span class="m"><b class="num">${tot.prix.principal}</b><span>${tot.prix.suffixe} · ${fj(tot.jMin)} à ${fj(tot.jMax)} j</span></span><span class="go">Choisir →</span>`:""}
    </div>`;}).join("")}</div>`;
}
function ligneHTML(l){
  if(l.facts) return `<div class="facts">${l.facts.map(f=>`<span class="fact ${f.c||""}">${f.t}</span>`).join("")}</div>`;
  if(l.liste) return `<div><div class="kicker" style="margin-bottom:6px">${l.label}</div><ul class="ln">${l.liste.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(l.prix) return `<div class="price"><div class="main num">${l.prix.principal}<small>${l.prix.suffixe}</small></div>
      <div class="sub"><b>${l.prix.secondaire}</b> · ${l.prix.mention}${l.meta?` · ${l.meta}`:""}</div>
      ${l.indicatif?`<div class="facts" style="margin-top:8px"><span class="fact gold">Chiffrage indicatif</span></div>`:""}</div>`;
  if(l.frise) return friseHTML(l.frise);
  if(l.volets) return `<div class="mini-frise">${VOLETS.map(v=>`<div class="vl">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-weight:700;font-size:14px">${v.code} · ${v.titre}</b><span class="num" style="font-size:12.5px;color:var(--ink2)">${fj(v.j.min)}–${fj(v.j.max)} j</span></div>
      <span style="font-size:13.5px;color:var(--ink2)">${v.detail}</span></div>`).join("")}</div>`;
  if(l.contact) return `<div class="facts"><span class="fact gold" style="user-select:all;font-size:14px;padding:9px 14px">${CONFIG.contact}</span><button class="fact" id="cp">Copier</button></div>`;
  if(l.voir) return `<div class="facts"><button class="fact gold" data-aller="${l.voir}" style="font-size:13.5px;padding:9px 15px">${l.label} →</button></div>`;
  if(l.choixNiveau) return choixHTML(l.choixNiveau);
  return `<p class="${l.cls||"ln"}">${l.t}</p>`;
}
function lier(t){
  t.querySelectorAll("[data-aller]:not([data-b])").forEach(b=>{b.dataset.b=1;b.addEventListener("click",e=>{e.stopPropagation();aller(b.dataset.aller);});});
  t.querySelectorAll("[data-opt]:not([data-b])").forEach(b=>{b.dataset.b=1;
    const go=e=>{e.stopPropagation();brancher(b.dataset.opt);avancerPlan();};
    b.addEventListener("click",go); b.addEventListener("keydown",e=>{if(e.key==="Enter")go(e);});});
  t.querySelectorAll("[data-mf]:not([data-b])").forEach(b=>{b.dataset.b=1;b.addEventListener("click",e=>{e.stopPropagation();
    const d=t.querySelector(`[data-mfd="${b.dataset.mf}"]`), ouvert=!d.hidden;
    t.querySelectorAll("[data-mfd]").forEach(x=>x.hidden=true); if(!ouvert){d.hidden=false;d.scrollIntoView({block:"nearest",behavior:"smooth"});}});});
  const cp=t.querySelector("#cp");
  if(cp&&!cp.dataset.b){cp.dataset.b=1;cp.addEventListener("click",e=>{e.stopPropagation();
    navigator.clipboard?.writeText(CONFIG.contact).then(()=>{cp.textContent="Copié";setTimeout(()=>cp.textContent="Copier",1800);}).catch(()=>{});});}
}
function ajouter(t,l,scroll){
  const html=ligneHTML(l);
  if(l.choixNiveau && t.querySelector("#choix")) t.querySelector("#choix").outerHTML=html;
  else t.insertAdjacentHTML("beforeend",html);
  if(scroll) t.lastElementChild.scrollIntoView({block:"end",behavior:"smooth"});
  lier(t);
}
function entete(t,p){
  t.innerHTML="";
  if(p.kicker) t.insertAdjacentHTML("beforeend",`<div class="kicker">${p.kicker}</div>`);
  if(p.titre) t.insertAdjacentHTML("beforeend",`<h2${p.italique?' class="it"':""}>${p.titre}</h2>`);
}
function peindre(nouveauPlan){
  const p=plan(), t=$("#txt");
  if(nouveauPlan){ entete(t,p); iL=0; }
  if(iL<nbLignes(p)) ajouter(t,p.lignes[iL],!nouveauPlan);
  if(nouveauPlan) t.scrollTop=0;
  majBarre();
}
const romain=n=>["","I","II","III","IV","V"][n]||n;
function majBarre(){
  const p=plan(), tous=actes.reduce((s,a)=>s+a.plans.length,0);
  const faits=actes.slice(0,iA).reduce((s,a)=>s+a.plans.length,0)+iP;
  $("#acte").innerHTML=`${iA?`<b>${romain(iA)}</b> · `:""}${actes[iA].nom}`;
  $("#prog i").style.width=((faits+1)/tous*100)+"%";
  $("#pct").textContent=`${faits+1} / ${tous}`;
  const reste=iL<nbLignes(p)-1, dernier=p.choix&&!reste;
  $("#hint").innerHTML=dernier?`<span class="pulse"></span><span>Choisissez une trajectoire</span>`:`<kbd>espace</kbd> <span>${reste?"suite":"plan suivant"}</span>`;
  $("#next").style.visibility=dernier?"hidden":"visible";
  $("#prev").disabled=(iA===0&&iP===0);
  $("#next").textContent=(iA===actes.length-1&&iP===actes[iA].plans.length-1)?"Fin":"Suite";
  document.querySelectorAll("#jump .jb").forEach(b=>b.classList.toggle("on",
    (b.dataset.aller==="debut"&&iA===0)||(b.dataset.aller===choixFait&&iA>actes.indexOf(CHOIX_ACTE))));
}
function avancerPlan(){
  const a=actes[iA];
  if(iP<a.plans.length-1) iP++;
  else if(iA<actes.length-1){iA++;iP=0;}
  else return false;
  const p=plan(); const d=goto(p.cadre); focus(p.part);
  busy=true; setTimeout(()=>{peindre(true);busy=false;}, Math.min(260,d*.35));
  return true;
}
function suivant(){
  if(busy||document.getElementById("intro")) return;
  const p=plan();
  if(iL<nbLignes(p)-1){iL++;peindre(false);return;}
  if(p.choix) return;
  avancerPlan();
}
function precedent(){
  if(busy||document.getElementById("intro")) return;
  if(iP>0) iP--; else if(iA>0){iA--;iP=actes[iA].plans.length-1;} else return;
  const p=plan(); const d=goto(p.cadre); focus(p.part);
  iL=Math.max(0,nbLignes(p)-1);
  busy=true; setTimeout(()=>{
    const t=$("#txt"); entete(t,p);
    for(let i=0;i<=iL;i++) ajouter(t,p.lignes[i],false);
    majBarre(); busy=false;
  }, Math.min(260,d*.35));
}

/* ---------- commandes ---------- */
addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"||e.key==="PageDown"){
    if(e.target.matches("[data-opt],button")&&e.key==="Enter") return;
    e.preventDefault();suivant();}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();precedent();}
});
$("#scene").addEventListener("click",e=>{if(!e.target.closest("button,[data-opt],a")) suivant();});
$("#next").addEventListener("click",e=>{e.stopPropagation();suivant();});
$("#prev").addEventListener("click",e=>{e.stopPropagation();precedent();});
document.querySelectorAll("#jump .jb").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();aller(b.dataset.aller);}));
let sx=0,sy=0;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx<0?suivant():precedent();}
},{passive:true});
addEventListener("resize",()=>goto(plan().cadre,true));

if(document.documentElement.classList.contains("lite")){
  document.querySelectorAll("svg defs animate").forEach(a=>a.remove());
}
goto("entier",true); focus(null); peindre(true);

/* ---------- intro vidéo ---------- */
(function(){
  const intro=$("#intro"), vid=$("#vid"), logo=$("#logo");
  let montre=false;
  const montrerLogo=()=>{ if(montre) return; montre=true; vid.classList.add("fade"); logo.hidden=false; };
  vid.addEventListener("ended",montrerLogo);
  vid.addEventListener("error",montrerLogo);
  vid.addEventListener("stalled",()=>setTimeout(montrerLogo,2500));
  const p=vid.play(); if(p&&p.catch) p.catch(montrerLogo);
  setTimeout(montrerLogo,12000);
  logo.addEventListener("click",e=>{e.stopPropagation();intro.classList.add("out");setTimeout(()=>intro.remove(),950);});
  intro.addEventListener("click",e=>e.stopPropagation());
})();
</script>
</body></html>
